[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "electorn"
version = "0.1.0"
description = "One CLI. A Complete AI Development Team powered by Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Harshan Seliyan (HS AI Solutions)", email = "harshanseliyan28@gmail.com" }
]

keywords = [
    "ai",
    "agents",
    "ollama",
    "development",
    "multi-agent",
    "cli",
    "self-repair",
    "local-ai"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://hs-ai-studio.onrender.com/"
Studio = "https://hs-ai-studio.onrender.com/"
Repository = "https://github.com/25it038-beep/Electron"
LinkedIn = "https://www.linkedin.com/in/harshan-seliyan-b-s-5339b4282"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.2.0",
]

[project.scripts]
electorn = "electorn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
